# Link-checker config for the CI "Link check" stage (Jenkinsfile).
#
# Sites that cannot be reliably checked from the CI agent are excluded here: some block
# non-browser user agents (lychee's requests get 403), and some are unreachable from the
# agent's network. The links work fine in a real browser. Patterns are regexes matched
# against the URL

exclude = [
  "https://join\\.slack\\.com/",
  "https://openspacesupport\\.slack\\.com/",
  "https://www\\.amnh\\.org/",
  "https://www\\.dmns\\.org/",
  "http://dx\\.doi\\.org/",
  "https://www\\.linkedin\\.com/",
  "https://duckduckgo\\.com/",
]
