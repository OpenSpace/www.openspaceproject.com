<script>
// Provides a navigation bar on the right side with orbit-like dots that can be used to
// navigate between different headers of the page

(() => {
  const dotNav = document.querySelector('.dotnav');
  if (!dotNav) {
    return;
  }

  // Auto-generate buttons from .content-section[id]/.content-section-narrow[id]
  // elements when the nav is empty
  if (dotNav.querySelectorAll('.dotnav__item').length === 0) {
    Array.from(document.querySelectorAll('.content-section[id], .content-section-narrow[id]')).forEach((section, i) => {
      let heading = section.querySelector('h2, h3, h4');
      let label = heading ? heading.textContent.trim() : section.id;
      let btn = document.createElement('button');
      btn.className = 'dotnav__item' + (i === 0 ? ' is-active' : '');
      btn.dataset.target = section.id;
      btn.setAttribute('aria-label', label);
      dotNav.appendChild(btn);
    });
  }

  const navItems = Array.from(dotNav.querySelectorAll('.dotnav__item'));
  const sections = navItems.map((item) => {
    return document.getElementById(item.dataset.target);
  }).filter(Boolean);
  let currentIndex = 0;

  function navbarHeight() {
    let nav = document.querySelector('.navbar, .quarto-navbar, header.navbar');
    return nav ? nav.offsetHeight + 12 : 80;
  }

  function setActive(index) {
    currentIndex = Math.max(0, Math.min(index, sections.length - 1));
    navItems.forEach((item, i) => {
      item.classList.toggle('is-active', i === currentIndex);
    });
  }

  function goTo(index) {
    index = Math.max(0, Math.min(index, sections.length - 1));
    setActive(index);
    const top = sections[index].getBoundingClientRect().top + window.pageYOffset - navbarHeight();
    window.scrollTo({ top: top, behavior: 'smooth' });
  }

  navItems.forEach((item, i) => {
    item.addEventListener('click', () => { goTo(i); });
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      goTo(currentIndex + 1);
    }
    if (e.key === 'ArrowUp') {
      e.preventDefault();
      goTo(currentIndex - 1);
    }
  });

  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          const idx = sections.indexOf(entry.target);
          if (idx !== -1) {
            setActive(idx);
          }
        }
      });
    }, { rootMargin: '-35% 0px -35% 0px', threshold: 0 });
    sections.forEach((s) => { observer.observe(s); });
  }

  setActive(0);
})();
</script>
