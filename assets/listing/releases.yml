#
# Previous OpenSpace releases, newest first.
#
# Drives the "Previous Versions" page table (install/previous-versions.qmd via
# _template/previous-versions.ejs.md).
#
# When publishing a new release, move the current release (see _release.yml)
# into this list with its release date.
#
# Fields:
#   - version: Version number without the leading "v"
#   - released: Human-readable release date (e.g. "April 2026")
#   - downloads: List of download links, in display order. Each entry:
#       - label: Link text (Full / Lightweight / ...)
#       - url: Download URL
#       - platform: (optional) Platform label rendered before the link, for
#         releases that shipped per-platform builds (e.g. 0.18.0)
#   - notes: URL of the GitHub release notes
#
