#
# Use Cases
# Fields:
#   - id: The identifier for this case
#   - image: The background image for the use-case icon
#   - image_alt: Alt text for the image
#   - institution: The institution that has produced the use case
#   - location (optional): The place where the institution is located
#   - title: A descriptive title for the use case that can be a bit longer
#   - shorttitle (optional): If specified, this is the title for the initial card. If not
#                            specified, the title field is used instead
#   - body: A descriptive text for the use case
#   - tags: A list of tags for the use case
#

- id: museum-life-science
  image: /assets/images/use-cases/mols_tiltatable.webp
  image_alt: >
    A visitor uses a tilt table with live OpenSpace visuals at the Museum of Life &
    Science
  institution: Museum of Life & Science
  location: Durham, NC
  title: Real Time Planet Exploration at Full Tilt
  body: >
    Live OpenSpace visuals shift and rotate on this tilt table, so Museum visitors can
    explore a planet from all directions with just the flick of a wrist. This hands-on
    design allows individuals to steer around the surface of the Earth with the speed and
    focus of the visitor's choosing. OpenSpace delivers near real-time views of our
    dynamic planet.
  tags:
    - Interactive exhibit
    - Real-time data
    - Public museum

- id: b612
  image: /assets/images/use-cases/b612_asteroids.webp
  image_alt: >
    Visualization of asteroid trajectories near Earth rendered in OpenSpace
  institution: B612's Asteroid Institute
  location:
  title: OpenSpace Defends the Planet
  body: >
    "Ed Lu wants to save Earth from killer asteroids." A New York Times article (May 31,
    2022) describes how Astronaut Lu and the team at B612's Asteroid Institute use
    OpenSpace software within their workflow to follow asteroids' trajectories, assessing
    whether danger is posed to Earth. OpenSpace's capability to incorporate new data as
    it emerges allows these scientists and engineers to contextualize and visualize
    current data developed from their Asteroid Discovery Analysis and Mapping (ADAM)
    platform.
  tags:
    - Scientific research
    - Planetary defense
    - Live data

- id: lawrence
  image: /assets/images/use-cases/lawrence.webp
  image_alt: >
    Visitors at the Lawrence Hall of Science piloting the planetarium dome with OpenSpace
  institution: Lawrence Hall of Science
  location: Berkeley, CA
  title: OpenSpace Gives Visitors Control of the Planetarium Dome
  shorttitle: Visitors Control the Dome
  body: >
    OpenSpace began by focusing on enabling live presentations by professionals in
    planetarium domes. Now a new program at The Lawrence invites anyone to become
    "Planetarium Pilots." No experience with the software is needed. By tapping on a
    tablet, visitors can take themselves (and everyone watching) to the moon and back, all
    over the universe, or anywhere in between. Voice-overs explain the space science
    behind the visuals as visitors fly around space.
  tags:
    - Planetarium
    - Public engagement
    - Visitor-led exploration

- id: houston
  image: /assets/images/use-cases/houston.webp
  image_alt: >
    Visitors at the Houston Museum of Natural Science playing an OpenSpace-based space
    science game
  institution: Houston Museum of Natural Science
  location: Houston, TX
  title: Gaming with OpenSpace
  body: >
    In Texas, OpenSpace videos and photos form the backbone of HMNS's space science game
    lab. The lab has a family focus, fostering increased social engagement through the
    room's fifteen-plus stations and seating. In addition to families, the lab attracts
    visitors of all ages looking for a quiet space of collaborative learning. For kids and
    by kids — high school interns programmed the games using content they captured
    themselves within OpenSpace.
  tags:
    - K–12 education
    - Games
    - Family learning

- id: towson
  image: /assets/images/use-cases/towson.webp
  image_alt: A view of Earth from space as shown in OpenSpace
  institution: Towson University Planetarium
  location: Baltimore County, MD
  title: OpenSpace Takes Audiences from Sunrise to Sunset
  body: >
    What do kids from Title One schools, scout troops, older adults with dementia and
    their caregivers, and the state Higher Education Commission all have in common? These
    are all audiences at Towson University's planetarium. The planetarium director chooses
    to use OpenSpace for talks and shows, as it "gives a better viewing experience and
    uses real data." The growth of OpenSpace users increases growth in both the software
    and in new content areas, creating a more powerful system over time.
  tags:
    - Diverse audiences
    - Planetarium
    - University

- id: asu
  image: /assets/images/use-cases/arizona_state.webp
  image_alt: >
    Visitors piloting the Interactive Immersive Educational Experience display at ASU
  institution: Marston Exploration Theater, ASU
  location: Tempe, AZ
  title: Passers-By Fly High in OpenSpace
  shorttitle: Passers-By Fly High
  body: >
    In the queueing area for ASU's Exploration Theater, visitors can do more than watch a
    tour of the universe — they pilot it. The Interactive Immersive Educational Experience
    (I2E2) is a panoramic display controlled by the visitor who wants to explore space and
    Earth in their own way, with room for 20 other students or family members. This
    implementation makes it easy for untrained pilots to fly, hover, and dive into the
    planetary or geological body of their choosing.
  tags:
    - Interactive kiosk
    - Panoramic display
    - University

- id: wow-room
  image: /assets/images/use-cases/wow_room.webp
  image_alt: >
    Visitors seated in the Wow Room at NASA Goddard CCMC watching an OpenSpace
    visualization on a curved screen
  institution: NASA Goddard CCMC
  location: Greenbelt, MD
  title: Step Into the Wow Room
  body: >
    The Community Coordinated Modelling Center (CCMC) uses OpenSpace in their "Wow Room,"
    a space at the Center for engaging high-profile guests — whether they are national
    policy makers or senior NASA leadership. Four projectors and a curved screen create an
    immersive experience that helps make the case for the importance of supporting space
    and Earth science research.
  tags:
    - Policy outreach
    - Immersive display
    - NASA

- id: ncmns
  image: /assets/images/use-cases/ncmns.webp
  image_alt: >
    Dr. Rachel Smith giving a presentation with OpenSpace visualizations
  institution: North Carolina Museum of Natural Sciences
  location: Raleigh, NC
  title: "To Infinity and Beyond: OpenSpace as a Powerful Outreach Tool"
  shorttitle: A Powerful Outreach Tool
  body: >
    Dr. Rachel Smith uses OpenSpace in research, teaching, and museum exhibitions.
    OpenSpace's data-rich visualizations enable Dr. Smith's compelling outreach to a wide
    variety of audiences including retirement communities, science conferences, and public
    policy groups.
  tags:
    - Super User
    - Research
    - Public outreach

- id: hyperwall
  image: /assets/images/use-cases/hyperwall.webp
  image_alt: >
    A scientist presenting OpenSpace data visualizations at a conference
  institution: NASA Hyperwall
  location: Conferences nationwide
  title: Talking Peer-to-Peer
  body: >
    Scientists regularly share their work using OpenSpace on the NASA Hyperwall at
    conferences — including the Geological Society of America, American Geophysical Union,
    and American Astronomical Society. OpenSpace's impressive visualizations and the
    ability to interact with those visualizations supports in-depth peer discussions in
    conference settings.
  tags:
    - Scientific conferences
    - NASA Hyperwall
    - Peer discussion
