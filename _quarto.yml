project:
  type: website
  output-dir: _site
  preview:
    port: 12800
  # resources:
    # - assets/js/slider.js

format:
  html:
    quarto-required: 1.9.*
    theme:
      # light:
      #   - "assets/style/brand.scss"
      #   - "assets/style/openspace-theme.scss"
      #   - "assets/style/openspace-theme-light.scss"
      # dark:
        - "assets/style/brand.scss"
        - "assets/style/openspace-theme-dark.scss"
        - "assets/style/hero.scss"
    include-after-body:
      - file: template/hero.html
    anchor-sections: false
    smooth-scroll: true
    # tabsets: true
    respect-user-color-scheme: true
    toc: false
    cap-location: bottom
    # page-layout: custom
    grid:
      body-width: 1000px
      sidebar-width: 0px
      margin-width: 0px
    # appendix-style:
    # title-block-style: none
    # title-block-banner: "#ff0000"
    # title-block-categories: true
    execution:
      echo: false
      warning: true
    lightbox: true
    link-external-icon: true
    link-external-newwindow: true
    lang: "en"
    axe: true
    # include-before-body:
    # include-after-body:
    # include-in-header:
    # resources:

website:
  title: "OpenSpace"
  description: "Official OpenSpace Website"
  favicon: "/assets/logos/openspace/icon.webp"
  image: "/assets/logos/openspace/logo.webp"
  image-alt: "OpenSpace"
  site-url: "https://www.openspaceproject.com"
  # repo-url: "https://github.com/OpenSpace/www.openspaceproject.com"
  # repo-link-target: "_blank"
  # repo-actions: [edit, issue]
  llms-txt: true
  # google-analytics:
  # cookie-consent:
  #   type: express
  #   style: simple
  #   palette: dark
  #   policy-url: www.openspaceproject.com
  search: false

  # body-header:
  body-footer: ""
  page-navigation: false
  back-to-top-navigation: false
  bread-crumbs: true
  # page-footer:
  open-graph: true
  # twitter-card:
  #   creator: "@openspaceproj"
  #   site: "@openspaceproj"
  # other-links:
  # code-links:
  draft-mode: unlinked


  # sidebar:
  #   search: true
  #   title: Sidebar
  #   tools:

  # margin:

  announcement:
    icon: info-circle
    content: "_Alert_ - Draft webpage"
    dismissable: true
    position: above-navbar

  page-footer:
    border: true
    background: dark
    foreground: light
    left: |
      OpenSpace is available under the [MIT License](https://github.com/OpenSpace/OpenSpace/blob/master/LICENSE.md).
    center: |
      © OpenSpace Project Team 2026
    right: |
      [{{< iconify fa7-brands:x-twitter >}}](https://x.com/openspaceproj){.no-external}
      [{{< iconify fa7-brands:instagram >}}](https://instagram.com/openspaceproj){.no-external}
      [{{< iconify fa7-brands:square-youtube >}}](https://www.youtube.com/@OpenSpaceProj){.no-external}
      [{{< iconify fa7-brands:facebookt >}}](https://www.facebook.com/OpenSpaceProj){.no-external}
      [{{< iconify fa7-brands:github >}}](https://github.com/OpenSpace/OpenSpace){.no-external}
      [{{< iconify fa7-brands:reddit >}}](https://www.reddit.com/r/OpenSpaceProject){.no-external}
      [{{< iconify fa7-brands:linkedin >}}](https://www.linkedin.com/company/openspace-project/){.no-external}
      [{{< iconify material-symbols:mail >}}](ilto:{{< var email.support >}}){.no-external}

  navbar:
    title: false
    logo: "/assets/logos/openspace/horizontal-logo.webp"
    logo-alt: "OpenSpace"
    # background:
    # foreground:
    # search: false
    pinned: true
    collapse: true
    collapse-below: sm
    # toggle-position:
    # tools-collapse:

    # left:
    right:
      - text: "Home"
        href: index.qmd
      - text: About
        menu:
          - text: Team
            href: team.qmd
          - text: Partners
            href: partners.qmd
      - text: Resources
        menu:
          - text: Images
            href: resources-images.qmd
          - text: Server Status
            href: https://uptime.openspaceproject.com
      - text: Events
        href: events.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/OpenSpace/OpenSpace
        aria-label: "GitHub Repository"

  # listing:

extensions:
  iconify:
    set: "octicon"
    # size: "Huge"
    # width: "1em"
    # height: "1em"
    # flip: "horizontal"
    # rotate: "90deg"
    inline: true
    mode: "svg"
    style: "color: #ecf5fb;"

# List of available icons:  https://fontawesome.com/search?ic=free-collection
# List of available icons:  https://icon-sets.iconify.design/   via   https://github.com/mcanouil/quarto-iconify
